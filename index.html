<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saudade — Tactical Plan Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #faf7f2;
      --surface: #ffffff;
      --surface-2: #f3ece3;
      --border: #e8ddd2;
      --text: #2d2535;
      --text-2: #7a6e84;
      --text-3: #b0a8ba;
      --primary: #8b6f9a;
      --primary-hover: #7a5e89;
      --primary-light: #f2ecf7;
      --success: #4a8a6a;
      --success-light: #eaf4ef;
      --shadow-sm: 0 1px 4px rgba(45,37,53,0.07);
      --shadow: 0 4px 20px rgba(45,37,53,0.10);
      --shadow-lg: 0 8px 40px rgba(45,37,53,0.14);
      --radius-sm: 6px;
      --radius: 12px;
      --radius-lg: 18px;
      --transition: 0.18s ease;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.55;
      font-size: 15px;
    }

    /* ── Tag badges ── */
    .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; letter-spacing: .5px; padding: 3px 9px; border-radius: 20px; white-space: nowrap; text-transform: uppercase; }
    .tag-mvp { background: #fdf1ee; color: #b5432a; }
    .tag-pre { background: #fdf8ec; color: #8a6a1a; }
    .tag-post { background: #edf8f2; color: #2a7a52; }
    .tag-ongoing { background: #edf2f8; color: #2a4a8a; }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; border-radius: var(--radius-sm); font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; border: none; transition: var(--transition); text-decoration: none; }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-ghost { background: transparent; color: var(--text-2); border: 1.5px solid var(--border); }
    .btn-ghost:hover { background: var(--surface-2); border-color: var(--text-3); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-success:hover { background: #3a7a5a; }
    .btn-sm { padding: 6px 13px; font-size: 13px; }
    .btn-icon { padding: 8px; border-radius: var(--radius-sm); background: var(--surface-2); color: var(--text-2); border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: var(--transition); }
    .btn-icon:hover { background: var(--border); }

    /* ── Layout ── */
    #app { min-height: 100vh; }
    .view { display: none; }
    .view.active { display: block; }

    /* ── Nav / Header ── */
    .app-header {
      background: var(--surface);
      border-bottom: 1.5px solid var(--border);
      position: sticky; top: 0; z-index: 100;
      box-shadow: var(--shadow-sm);
    }
    .header-inner {
      max-width: 960px; margin: 0 auto; padding: 0 20px;
      display: flex; align-items: center; justify-content: space-between;
      height: 60px;
    }
    .header-title {
      font-family: 'Lora', Georgia, serif;
      font-size: 18px; font-weight: 500; color: var(--text);
      display: flex; align-items: center; gap: 8px;
    }
    .header-title span { color: var(--primary); }
    .header-nav { display: flex; gap: 8px; }

    /* ── Main container ── */
    .container { max-width: 960px; margin: 0 auto; padding: 28px 20px 60px; }

    /* ── Overall progress bar ── */
    .overall-progress-section {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 24px 28px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }
    .progress-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    .progress-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-2); }
    .progress-count { font-size: 15px; font-weight: 600; color: var(--text); }
    .progress-count em { color: var(--primary); font-style: normal; }
    .progress-bar-outer {
      height: 14px; background: var(--surface-2); border-radius: 20px; overflow: hidden;
      position: relative;
    }
    .progress-bar-inner {
      height: 100%; border-radius: 20px;
      background: linear-gradient(90deg, #8b6f9a 0%, #c07090 100%);
      transition: width 0.6s cubic-bezier(.22,.68,0,1.2);
      position: relative;
    }
    .progress-bar-inner::after {
      content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 8px;
      background: rgba(255,255,255,0.35); border-radius: 0 20px 20px 0;
    }
    .progress-pct { font-size: 30px; font-weight: 700; color: var(--primary); margin-top: 8px; font-variant-numeric: tabular-nums; }
    .progress-pct small { font-size: 14px; font-weight: 400; color: var(--text-2); margin-left: 4px; }

    /* ── Next Step Card ── */
    .next-step-section { margin-bottom: 24px; }
    .section-title { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-2); margin-bottom: 12px; }
    .next-step-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 28px;
      box-shadow: var(--shadow);
      border-left: 4px solid var(--primary);
      position: relative; overflow: hidden;
    }
    .next-step-card::before {
      content: '';
      position: absolute; top: 0; right: 0; width: 200px; height: 200px;
      background: radial-gradient(circle at top right, var(--primary-light) 0%, transparent 70%);
      pointer-events: none;
    }
    .next-step-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    .next-step-phase { font-size: 12px; font-weight: 600; color: var(--text-2); }
    .next-step-outcome { font-size: 13px; color: var(--text-2); margin-bottom: 8px; }
    .next-step-text {
      font-family: 'Lora', Georgia, serif;
      font-size: 21px; font-weight: 500; color: var(--text);
      line-height: 1.4; margin-bottom: 18px;
    }
    .next-step-footer { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .next-step-time { font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 4px; }
    .timer-display {
      font-size: 20px; font-weight: 700; color: var(--primary);
      font-variant-numeric: tabular-nums; min-width: 60px;
    }
    .all-done-card {
      background: var(--success-light);
      border-radius: var(--radius-lg);
      padding: 32px;
      text-align: center;
      border: 2px solid #b8e0cc;
    }
    .all-done-card h2 { font-family: 'Lora', Georgia, serif; font-size: 22px; color: var(--success); margin-bottom: 8px; }
    .all-done-card p { color: var(--text-2); }

    /* ── Phase Grid ── */
    .phase-grid-section { margin-bottom: 24px; }
    .phase-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }
    .phase-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      border-top: 3px solid var(--phase-color, var(--primary));
      cursor: pointer;
      transition: var(--transition);
    }
    .phase-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .phase-card-number { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-3); margin-bottom: 4px; }
    .phase-card-name { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 10px; line-height: 1.3; }
    .phase-card-bar-outer { height: 6px; background: var(--surface-2); border-radius: 10px; overflow: hidden; margin-bottom: 6px; }
    .phase-card-bar-inner { height: 100%; border-radius: 10px; background: var(--phase-color, var(--primary)); transition: width 0.5s ease; }
    .phase-card-count { font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }

    /* ── Recent Activity ── */
    .recent-section { margin-bottom: 24px; }
    .activity-list { display: flex; flex-direction: column; gap: 8px; }
    .activity-item {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex; align-items: flex-start; gap: 12px;
      box-shadow: var(--shadow-sm);
    }
    .activity-check { width: 20px; height: 20px; background: var(--success-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
    .activity-check svg { color: var(--success); }
    .activity-text { font-size: 13px; color: var(--text); flex: 1; line-height: 1.4; }
    .activity-meta { font-size: 11px; color: var(--text-3); margin-top: 2px; }
    .activity-time { font-size: 12px; color: var(--text-3); white-space: nowrap; margin-left: auto; }

    /* ── Steps View ── */
    .steps-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .steps-title { font-family: 'Lora', Georgia, serif; font-size: 22px; font-weight: 500; }
    .steps-filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn { font-size: 12px; padding: 5px 12px; border-radius: 20px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text-2); cursor: pointer; font-family: inherit; font-weight: 500; transition: var(--transition); }
    .filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .filter-btn:hover:not(.active) { border-color: var(--primary); color: var(--primary); }

    /* ── Phase Section (Steps View) ── */
    .phase-section { margin-bottom: 16px; border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); }
    .phase-section-header {
      background: var(--surface);
      padding: 18px 22px;
      display: flex; align-items: center; gap: 14px;
      cursor: pointer; user-select: none;
      border-bottom: 1.5px solid var(--border);
      transition: background var(--transition);
    }
    .phase-section-header:hover { background: #fdfbf8; }
    .phase-section-header.open { border-bottom-color: transparent; }
    .phase-badge {
      width: 32px; height: 32px; border-radius: 8px;
      background: var(--phase-color, var(--primary));
      color: #fff; font-size: 13px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .phase-section-name { flex: 1; }
    .phase-section-name strong { font-size: 15px; display: block; }
    .phase-section-name span { font-size: 12px; color: var(--text-2); }
    .phase-section-progress { text-align: right; }
    .phase-section-pct { font-size: 14px; font-weight: 700; color: var(--primary); }
    .phase-section-frac { font-size: 11px; color: var(--text-3); display: block; }
    .phase-section-chevron { color: var(--text-3); transition: transform var(--transition); }
    .phase-section.open .phase-section-chevron { transform: rotate(180deg); }

    .phase-section-body { background: var(--surface); display: none; }
    .phase-section.open .phase-section-body { display: block; }

    /* ── Outcome Group ── */
    .outcome-group { border-bottom: 1px solid var(--border); }
    .outcome-group:last-child { border-bottom: none; }
    .outcome-header {
      padding: 14px 22px;
      display: flex; align-items: center; gap: 10px;
      background: #fdfaf7;
    }
    .outcome-title { font-size: 13px; font-weight: 600; color: var(--text); flex: 1; line-height: 1.3; }
    .outcome-count { font-size: 11px; color: var(--text-3); white-space: nowrap; }

    /* ── Step Row ── */
    .step-row {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 22px 12px 42px;
      transition: background var(--transition);
      position: relative;
    }
    .step-row:hover { background: #fdfaf7; }
    .step-row.completed { opacity: .7; }
    .step-row.completed .step-text { text-decoration: line-through; color: var(--text-2); }
    .step-row.in-progress { background: var(--primary-light); }

    .step-checkbox {
      width: 20px; height: 20px; border-radius: 5px;
      border: 2px solid var(--border); background: var(--surface);
      cursor: pointer; flex-shrink: 0; margin-top: 1px;
      display: flex; align-items: center; justify-content: center;
      transition: var(--transition);
    }
    .step-checkbox:hover { border-color: var(--primary); }
    .step-checkbox.checked { background: var(--success); border-color: var(--success); }
    .step-checkbox.checked svg { display: block; }
    .step-checkbox svg { display: none; }
    .step-checkbox.in-progress { border-color: var(--primary); background: var(--primary-light); }

    .step-content { flex: 1; min-width: 0; }
    .step-text { font-size: 14px; color: var(--text); line-height: 1.45; margin-bottom: 4px; }
    .step-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .step-est { font-size: 12px; color: var(--text-3); }
    .step-duration { font-size: 12px; color: var(--success); font-weight: 500; }
    .step-live-timer { font-size: 13px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; }
    .step-completed-at { font-size: 11px; color: var(--text-3); }

    .step-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .step-start-btn {
      font-size: 12px; padding: 4px 10px; border-radius: var(--radius-sm);
      background: var(--primary-light); color: var(--primary);
      border: 1.5px solid #d8c8e8; cursor: pointer; font-family: inherit; font-weight: 500;
      transition: var(--transition); white-space: nowrap;
    }
    .step-start-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
    .step-done-btn {
      font-size: 12px; padding: 4px 10px; border-radius: var(--radius-sm);
      background: var(--success-light); color: var(--success);
      border: 1.5px solid #b8e0cc; cursor: pointer; font-family: inherit; font-weight: 500;
      transition: var(--transition); white-space: nowrap;
    }
    .step-done-btn:hover { background: var(--success); color: #fff; border-color: var(--success); }

    /* ── Add custom step ── */
    .add-step-row {
      padding: 8px 22px 8px 42px;
    }
    .add-step-btn {
      font-size: 12px; color: var(--text-3); background: none; border: 1.5px dashed var(--border);
      border-radius: var(--radius-sm); padding: 5px 12px; cursor: pointer;
      font-family: inherit; transition: var(--transition);
      display: inline-flex; align-items: center; gap: 5px;
    }
    .add-step-btn:hover { border-color: var(--primary); color: var(--primary); }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(45,37,53,0.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; padding: 20px;
      opacity: 0; pointer-events: none; transition: opacity var(--transition);
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface); border-radius: var(--radius-lg);
      padding: 28px; width: 100%; max-width: 480px;
      box-shadow: var(--shadow-lg);
      transform: translateY(12px); transition: transform var(--transition);
    }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal-title { font-family: 'Lora', Georgia, serif; font-size: 18px; font-weight: 500; margin-bottom: 6px; }
    .modal-subtitle { font-size: 13px; color: var(--text-2); margin-bottom: 20px; }
    .modal-field { margin-bottom: 16px; }
    .modal-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; letter-spacing: .3px; }
    .modal-input, .modal-select, .modal-textarea {
      width: 100%; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      padding: 10px 14px; font-family: inherit; font-size: 14px; color: var(--text);
      background: var(--surface); transition: border-color var(--transition);
    }
    .modal-input:focus, .modal-select:focus, .modal-textarea:focus {
      outline: none; border-color: var(--primary);
    }
    .modal-textarea { resize: vertical; min-height: 80px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

    /* ── Celebration ── */
    .confetti-container {
      position: fixed; inset: 0; pointer-events: none; z-index: 2000;
      overflow: hidden;
    }
    .confetti-dot {
      position: absolute; width: 8px; height: 8px; border-radius: 50%;
      animation: confetti-fall linear forwards;
    }
    @keyframes confetti-fall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    /* ── Toast ── */
    .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 3000; display: flex; flex-direction: column; gap: 10px; }
    .toast {
      background: var(--text); color: #fff; padding: 12px 18px; border-radius: var(--radius);
      font-size: 14px; font-weight: 500; box-shadow: var(--shadow-lg);
      animation: toast-in 0.3s ease, toast-out 0.3s ease 2.7s forwards;
      max-width: 320px;
    }
    .toast.success { background: var(--success); }
    @keyframes toast-in { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
    @keyframes toast-out { from { opacity: 1; } to { opacity: 0; } }

    /* ── Empty state ── */
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-2); }
    .empty-state svg { opacity: .3; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .container { padding: 16px 12px 60px; }
      .phase-grid { grid-template-columns: repeat(2, 1fr); }
      .next-step-text { font-size: 18px; }
      .header-inner { padding: 0 12px; }
      .step-row { padding-left: 16px; }
      .outcome-header { padding: 12px 16px; }
      .add-step-row { padding-left: 16px; }
      .phase-section-header { padding: 14px 16px; }
    }

    /* ── Utilities ── */
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .gap-2 { gap: 8px; }
    .mt-2 { margin-top: 8px; }
  </style>
</head>
<body>
<div id="app"></div>
<div class="toast-container" id="toasts"></div>
<div class="confetti-container" id="confetti"></div>

<div id="modal-overlay" class="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-box">
    <h2 class="modal-title">Add a Custom Step</h2>
    <p class="modal-subtitle" id="modal-context"></p>
    <div class="modal-field">
      <label class="modal-label">Step description</label>
      <textarea class="modal-textarea" id="modal-step-text" placeholder="What do you need to do? (e.g., 'Research Minnesota LLC fees')"></textarea>
    </div>
    <div class="modal-field">
      <label class="modal-label">Tag</label>
      <select class="modal-select" id="modal-step-tag">
        <option value="MVP-CRITICAL">MVP-CRITICAL</option>
        <option value="PRE-LAUNCH">PRE-LAUNCH</option>
        <option value="POST-LAUNCH">POST-LAUNCH</option>
        <option value="ONGOING">ONGOING</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitCustomStep()">Add Step</button>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// DATA
// ─────────────────────────────────────────────────────────────────────────────

const PHASES = [
  {
    id:'p0', n:0, name:'Foundation & Setup',
    desc:'Get your accounts, tools, and environment ready. Do this first; it unblocks everything else.',
    color:'#9b7bb0',
    outcomes:[
      { id:'p0-o1', title:'Register a domain name and set up a professional email', tag:'MVP-CRITICAL', steps:[
        {id:'p0-o1-s1', text:'Brainstorm 5 possible domain names for Saudade', est:15},
        {id:'p0-o1-s2', text:'Check availability on a registrar like Namecheap or Cloudflare', est:15},
        {id:'p0-o1-s3', text:'Purchase the one you like best', est:15},
        {id:'p0-o1-s4', text:'Set up a forwarding email like hello@yourdomain.com', est:20},
        {id:'p0-o1-s5', text:'Add the domain and email to a password manager so you never lose them', est:10},
      ]},
      { id:'p0-o2', title:'Create the developer accounts you\'ll need', tag:'MVP-CRITICAL', steps:[
        {id:'p0-o2-s1', text:'Create a GitHub account if you don\'t have one', est:15},
        {id:'p0-o2-s2', text:'Create a Vercel account and connect it to GitHub', est:15},
        {id:'p0-o2-s3', text:'Create a Supabase account', est:15},
        {id:'p0-o2-s4', text:'Confirm you have an Anthropic API account and can see your API key', est:15},
        {id:'p0-o2-s5', text:'Store every login in your password manager', est:15},
      ]},
      { id:'p0-o3', title:'Set up your local development environment', tag:'MVP-CRITICAL', steps:[
        {id:'p0-o3-s1', text:'Install Node.js (LTS version) on your MacBook Air', est:20},
        {id:'p0-o3-s2', text:'Install a code editor (VS Code) if not already installed', est:15},
        {id:'p0-o3-s3', text:'Install Git and confirm it works by running `git --version` in the terminal', est:15},
        {id:'p0-o3-s4', text:'Create one folder on your machine called `saudade` where the project will live', est:5},
        {id:'p0-o3-s5', text:'Write yourself a one-line note of what each tool does, for your own reference', est:15},
      ]},
      { id:'p0-o4', title:'Choose and confirm your technology stack', tag:'MVP-CRITICAL', steps:[

        {id:'p1-o3-s3', text:'Write one sentence describing the rule that separates them', est:15},

        {id:'p1-o4-s2', text:'For each, note what a \'not yet\' answer sounds like', est:20},

// STATE
// ─────────────────────────────────────────────────────────────────────────────

const STORAGE_KEY = 'saudade-tracker-v1';
let STATE = { steps: {}, customSteps: [] };

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) STATE = JSON.parse(saved);
  } catch(e) {}
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); } catch(e) {}
}

function stepState(id) {
  return STATE.steps[id] || { completed: false, startedAt: null, completedAt: null, durationMins: null };
}

// ─────────────────────────────────────────────────────────────────────────────
// DATA HELPERS
// ─────────────────────────────────────────────────────────────────────────────

function getAllCanonicalSteps() {
  const all = [];
  for (const phase of PHASES) {
    for (const outcome of phase.outcomes) {
      for (const step of outcome.steps) {
        all.push({ ...step, phaseId: phase.id, phaseName: phase.name, phaseN: phase.n, phaseColor: phase.color, outcomeId: outcome.id, outcomeTitle: outcome.title, tag: outcome.tag });
      }
    }
  }
  return all;
}

function getAllCustomSteps() {
  return STATE.customSteps || [];
}

function getPhaseStats(phaseId) {
  const phase = PHASES.find(p => p.id === phaseId);
  if (!phase) return { total: 0, done: 0 };
  let total = 0, done = 0;
  for (const o of phase.outcomes) {
    for (const s of o.steps) {
      total++;
      if (stepState(s.id).completed) done++;
    }
    // custom steps in this phase
    for (const cs of getAllCustomSteps().filter(cs => cs.phaseId === phaseId && cs.outcomeId === o.id)) {
      total++;
      if (stepState(cs.id).completed) done++;
    }
  }
  return { total, done };
}

function getOverallStats() {
  let total = 0, done = 0;
  for (const p of PHASES) {
    const s = getPhaseStats(p.id);
    total += s.total; done += s.done;
  }
  return { total, done };
}

function getNextStep() {
  for (const phase of PHASES) {
    for (const outcome of phase.outcomes) {
      const stepsInOutcome = [
        ...outcome.steps,
        ...getAllCustomSteps().filter(cs => cs.phaseId === phase.id && cs.outcomeId === outcome.id),
      ];
      for (const step of stepsInOutcome) {
        const ss = stepState(step.id);
        if (!ss.completed) {
          return { ...step, phaseId: phase.id, phaseName: phase.name, phaseN: phase.n, phaseColor: phase.color, outcomeId: outcome.id, outcomeTitle: outcome.title, tag: step.tag || outcome.tag };
        }
      }
    }
  }
  return null;
}

function getRecentlyCompleted(n = 5) {
  const all = getAllCanonicalSteps().concat(
    getAllCustomSteps().map(cs => {
      const phase = PHASES.find(p => p.id === cs.phaseId);
      return { ...cs, phaseName: phase ? phase.name : '', phaseColor: phase ? phase.color : '#888' };
    })
  );
  return all
    .filter(s => stepState(s.id).completed)
    .map(s => ({ ...s, ...stepState(s.id) }))
    .sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0))
    .slice(0, n);
}

// ─────────────────────────────────────────────────────────────────────────────
// ACTIONS
// ─────────────────────────────────────────────────────────────────────────────

let liveTimerInterval = null;
let liveTimerStepId = null;

function startStep(stepId) {
  if (!STATE.steps[stepId]) STATE.steps[stepId] = {};
  const ss = STATE.steps[stepId];
  if (ss.completed) return;
  if (ss.startedAt) return; // already started
  ss.startedAt = Date.now();
  saveState();
  startLiveTimer(stepId);
  render();
}

function completeStep(stepId) {
  if (!STATE.steps[stepId]) STATE.steps[stepId] = {};
  const ss = STATE.steps[stepId];
  ss.completed = true;
  ss.completedAt = Date.now();
  if (ss.startedAt && !ss.durationMins) {
    ss.durationMins = Math.max(1, Math.round((ss.completedAt - ss.startedAt) / 60000));
  }
  stopLiveTimer();
  saveState();
  showConfetti();
  showToast('Step complete! ✓', 'success');
  render();
}

function toggleStep(stepId) {
  if (!STATE.steps[stepId]) STATE.steps[stepId] = {};
  const ss = STATE.steps[stepId];
  if (ss.completed) {
    ss.completed = false;
    ss.completedAt = null;
  } else {
    ss.completed = true;
    ss.completedAt = ss.completedAt || Date.now();
    if (!ss.durationMins && ss.startedAt) {
      ss.durationMins = Math.max(1, Math.round((ss.completedAt - ss.startedAt) / 60000));
    }
    if (!ss.completed) {} else { showConfetti(); }
  }
  saveState();
  render();
}

function startLiveTimer(stepId) {
  stopLiveTimer();
  liveTimerStepId = stepId;
  liveTimerInterval = setInterval(() => {
    updateTimerDisplay();
  }, 1000);
}

function stopLiveTimer() {
  if (liveTimerInterval) { clearInterval(liveTimerInterval); liveTimerInterval = null; }
  liveTimerStepId = null;
}

function formatElapsed(startedAt) {
  const secs = Math.floor((Date.now() - startedAt) / 1000);
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function formatDuration(mins) {
  if (!mins) return '';
  if (mins < 60) return `${mins}m`;
  return `${Math.floor(mins/60)}h ${mins%60}m`;
}

function formatDate(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric' }) + ' at ' + d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
}

function updateTimerDisplay() {
  if (!liveTimerStepId) return;
  const ss = stepState(liveTimerStepId);
  if (!ss.startedAt) return;
  const elapsed = formatElapsed(ss.startedAt);
  // Update dashboard timer
  const dtEl = document.getElementById('dash-timer-display');
  if (dtEl) dtEl.textContent = elapsed;
  // Update steps view timer
  const stEl = document.getElementById(`timer-${liveTimerStepId}`);
  if (stEl) stEl.textContent = elapsed;
}

let pendingCustomStep = null;

function openAddStepModal(phaseId, outcomeId) {
  const phase = PHASES.find(p => p.id === phaseId);
  const outcome = phase ? phase.outcomes.find(o => o.id === outcomeId) : null;
  pendingCustomStep = { phaseId, outcomeId };
  document.getElementById('modal-context').textContent = outcome ? `Adding to: ${outcome.title}` : '';
  document.getElementById('modal-step-text').value = '';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('modal-step-text').focus(), 100);
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
  pendingCustomStep = null;
}

function submitCustomStep() {
  const text = document.getElementById('modal-step-text').value.trim();
  if (!text) { showToast('Please enter a step description'); return; }
  const tag = document.getElementById('modal-step-tag').value;
  const id = 'custom-' + Date.now();
  if (!STATE.customSteps) STATE.customSteps = [];
  STATE.customSteps.push({ id, phaseId: pendingCustomStep.phaseId, outcomeId: pendingCustomStep.outcomeId, text, tag });
  STATE.steps[id] = { completed: false, startedAt: null, completedAt: null, durationMins: null };
  saveState();
  document.getElementById('modal-overlay').classList.remove('open');
  pendingCustomStep = null;
  showToast('Custom step added!', 'success');
  render();
}

function tagBadge(tag) {
  const cls = tag === 'MVP-CRITICAL' ? 'tag-mvp' : tag === 'PRE-LAUNCH' ? 'tag-pre' : tag === 'POST-LAUNCH' ? 'tag-post' : 'tag-ongoing';
  const label = tag === 'MVP-CRITICAL' ? '⚡ MVP' : tag === 'PRE-LAUNCH' ? '🔖 Pre-launch' : tag === 'POST-LAUNCH' ? '🚀 Post-launch' : '🔄 Ongoing';
  return `<span class="tag ${cls}">${label}</span>`;
}

function checkIcon() {
  return `<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function showToast(msg, type = '') {
  const c = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ` ${type}` : '');
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3100);
}

function showConfetti() {
  const c = document.getElementById('confetti');
  const colors = ['#9b7bb0','#c0748a','#5b8fb3','#c09a6e','#5a9e7a','#e8b4a0','#f2d06b'];
  for (let i = 0; i < 30; i++) {
    const dot = document.createElement('div');
    dot.className = 'confetti-dot';
    dot.style.cssText = `left:${Math.random()*100}%;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${1.5+Math.random()*1.5}s;animation-delay:${Math.random()*0.5}s;width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>0.5?'50%':'3px'}`;
    c.appendChild(dot);
    setTimeout(() => dot.remove(), 3000);
  }
}

  window.scrollTo(0, 0);
}

function togglePhase(phaseId) {

  attachEvents();
  if (liveTimerStepId) updateTimerDisplay();
}

function renderDashboard() {
  const { total, done } = getOverallStats();
  const pct = total ? Math.round((done / total) * 100) : 0;
  const next = getNextStep();
  const recent = getRecentlyCompleted(4);

  const overallSection = `
    <div class="overall-progress-section">
      <div class="progress-header">
        <span class="progress-label">Overall Progress</span>
        <span class="progress-count"><em>${done}</em> of ${total} steps complete</span>
      </div>
      <div class="progress-bar-outer">
        <div class="progress-bar-inner" style="width:${pct}%"></div>
      </div>
      <div class="progress-pct">${pct}%<small>complete</small></div>
    </div>`;

  let nextSection = '';
  if (next) {
    const ss = stepState(next.id);
    const inProgress = ss.startedAt && !ss.completed;
    nextSection = `
      <div class="next-step-section">
        <div class="section-title">Your next step</div>
        <div class="next-step-card" style="border-left-color:${next.phaseColor}">
          <div class="next-step-meta">
            <span class="next-step-phase" style="color:${next.phaseColor}">Phase ${next.phaseN} · ${next.phaseName}</span>
            ${tagBadge(next.tag)}
          </div>
          <div class="next-step-outcome">${next.outcomeTitle}</div>
          <div class="next-step-text">${next.text}</div>
          <div class="next-step-footer">
            ${next.est ? `<span class="next-step-time">⏱ ~${next.est} min</span>` : ''}
            ${inProgress
              ? `<span class="timer-display" id="dash-timer-display">${formatElapsed(ss.startedAt)}</span>
                 <button class="btn btn-success" onclick="completeStep('${next.id}')">✓ Mark Complete</button>`
              : `<button class="btn btn-primary" onclick="startStep('${next.id}')">▶ Start Timer</button>
                 <button class="btn btn-ghost" onclick="completeStep('${next.id}')">✓ Done (no timer)</button>`
            }
          </div>
        </div>
      </div>`;
  } else {
    nextSection = `
      <div class="next-step-section">
        <div class="all-done-card">
          <h2>🎉 All done, Katya!</h2>
          <p>Every step in the Saudade Tactical Plan is complete. This is the whole staircase — you climbed it.</p>
        </div>
      </div>`;
  }

  const phaseGrid = PHASES.map(phase => {
    const { total: pt, done: pd } = getPhaseStats(phase.id);
    const ppct = pt ? Math.round((pd/pt)*100) : 0;
    return `
      <div class="phase-card" style="--phase-color:${phase.color}" onclick="switchView('steps'); setTimeout(()=>{openPhase('${phase.id}')},50)">
        <div class="phase-card-number">Phase ${phase.n}</div>
        <div class="phase-card-name">${phase.name}</div>
        <div class="phase-card-bar-outer"><div class="phase-card-bar-inner" style="width:${ppct}%"></div></div>
        <div class="phase-card-count">${pd} / ${pt} · ${ppct}%</div>
      </div>`;
  }).join('');

  const recentItems = recent.length
    ? recent.map(s => `
        <div class="activity-item">
          <div class="activity-check">${checkIcon()}</div>
          <div class="activity-text">
            ${s.text}
            <div class="activity-meta" style="color:${s.phaseColor}">${s.phaseName}</div>
          </div>
          ${s.durationMins ? `<div class="activity-time">${formatDuration(s.durationMins)}</div>` : ''}
        </div>`).join('')
    : `<div class="empty-state"><p>No completed steps yet — your first one is waiting above.</p></div>`;

  return `
    <header class="app-header">
      <div class="header-inner">
        <div class="header-title">🌿 <span>Saudade</span> Tactical Plan</div>
        <nav class="header-nav">
          <button class="btn btn-ghost btn-sm" onclick="switchView('steps')">All Steps →</button>
        </nav>
      </div>
    </header>
    <main class="container">
      ${overallSection}
      ${nextSection}
      <div class="phase-grid-section">
        <div class="section-title">Phase progress</div>

      </div>
      <div class="recent-section">
        <div class="section-title">Recently completed</div>
        <div class="activity-list">${recentItems}</div>
      </div>
    </main>`;
}

function renderStepsHTML() {
  const filterBtns = ['all','MVP-CRITICAL','PRE-LAUNCH','POST-LAUNCH','ONGOING'].map(f =>
    `<button class="filter-btn ${stepsFilter===f?'active':''}" onclick="setFilter('${f}')">${
      f==='all'?'All':f==='MVP-CRITICAL'?'⚡ MVP':f==='PRE-LAUNCH'?'🔖 Pre-launch':f==='POST-LAUNCH'?'🚀 Post-launch':'🔄 Ongoing'
    }</button>`
  ).join('');

  const phaseSections = PHASES.map(phase => {
    const { total: pt, done: pd } = getPhaseStats(phase.id);
    const ppct = pt ? Math.round((pd/pt)*100) : 0;
    const isOpen = openPhases.has(phase.id);

    // Filter outcomes/steps
    const filteredOutcomes = phase.outcomes.map(outcome => {
      const canonicalSteps = outcome.steps.filter(s => stepsFilter === 'all' || outcome.tag === stepsFilter || s.tag === stepsFilter);
      const customSteps = getAllCustomSteps().filter(cs => cs.phaseId === phase.id && cs.outcomeId === outcome.id && (stepsFilter === 'all' || cs.tag === stepsFilter));
      if (!canonicalSteps.length && !customSteps.length && stepsFilter !== 'all') return null;
      return { outcome, canonicalSteps: outcome.steps, customSteps };
    }).filter(Boolean);

    if (!filteredOutcomes.length) return '';

    const outcomesHTML = filteredOutcomes.map(({ outcome, canonicalSteps, customSteps }) => {
      const allSteps = [
        ...canonicalSteps,
        ...customSteps.map(cs => ({ ...cs, tag: cs.tag })),
      ].filter(s => stepsFilter === 'all' || (s.tag || outcome.tag) === stepsFilter);

      if (!allSteps.length) return '';

      const outcomeDone = allSteps.filter(s => stepState(s.id).completed).length;
      const stepsHTML = allSteps.map(step => {
        const ss = stepState(step.id);
        const tag = step.tag || outcome.tag;
        const inProgress = ss.startedAt && !ss.completed;
        return `
          <div class="step-row ${ss.completed?'completed':''} ${inProgress?'in-progress':''}" id="row-${step.id}">
            <div class="step-checkbox ${ss.completed?'checked':''} ${inProgress&&!ss.completed?'in-progress':''}"
                 onclick="toggleStep('${step.id}')">
              ${checkIcon()}
            </div>
            <div class="step-content">
              <div class="step-text">${step.text}</div>
              <div class="step-meta">
                ${step.est ? `<span class="step-est">~${step.est} min</span>` : ''}
                ${ss.durationMins ? `<span class="step-duration">✓ ${formatDuration(ss.durationMins)}</span>` : ''}
                ${inProgress ? `<span class="step-live-timer" id="timer-${step.id}">${formatElapsed(ss.startedAt)}</span>` : ''}
                ${ss.completedAt ? `<span class="step-completed-at">${formatDate(ss.completedAt)}</span>` : ''}
                ${tagBadge(tag)}
              </div>
            </div>
            <div class="step-actions">
              ${!ss.completed && !inProgress ? `<button class="step-start-btn" onclick="startStep('${step.id}')">▶ Start</button>` : ''}
              ${inProgress ? `<button class="step-done-btn" onclick="completeStep('${step.id}')">✓ Done</button>` : ''}
            </div>
          </div>`;
      }).join('');

      return `
        <div class="outcome-group">
          <div class="outcome-header">
            <div class="outcome-title">${outcome.title}</div>
            <span class="outcome-count">${outcomeDone}/${allSteps.length}</span>
          </div>
          ${stepsHTML}
          <div class="add-step-row">
            <button class="add-step-btn" onclick="openAddStepModal('${phase.id}','${outcome.id}')">＋ Add a step here</button>
          </div>
        </div>`;
    }).join('');

    return `
      <div class="phase-section ${isOpen?'open':''}" id="phase-section-${phase.id}">
        <div class="phase-section-header ${isOpen?'open':''}" onclick="togglePhase('${phase.id}')">
          <div class="phase-badge" style="background:${phase.color}">${phase.n}</div>
          <div class="phase-section-name">
            <strong>${phase.name}</strong>
            <span>${phase.desc.slice(0,60)}${phase.desc.length>60?'…':''}</span>
          </div>
          <div class="phase-section-progress">
            <div class="phase-section-pct">${ppct}%</div>
            <span class="phase-section-frac">${pd}/${pt} steps</span>
          </div>
          <svg class="phase-section-chevron" width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M4.5 6.75L9 11.25L13.5 6.75" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="phase-section-body">${outcomesHTML}</div>
      </div>`;
  }).join('');

  return `
    <header class="app-header">
      <div class="header-inner">
        <div class="header-title">🌿 <span>Saudade</span> Tactical Plan</div>
        <nav class="header-nav">
          <button class="btn btn-ghost btn-sm" onclick="switchView('dashboard')">← Dashboard</button>
        </nav>
      </div>
    </header>
    <main class="container">
      <div class="steps-header">
        <h1 class="steps-title">All 248 Steps</h1>
        <div class="steps-filters">${filterBtns}</div>
      </div>
      <div>${phaseSections}</div>
    </main>`;
}

function renderStepsView() {
  const app = document.getElementById('app');
  app.innerHTML = renderStepsHTML();
  attachEvents();
  if (liveTimerStepId) updateTimerDisplay();
}

function openPhase(phaseId) {
  openPhases.add(phaseId);
  const el = document.getElementById(`phase-section-${phaseId}`);
  if (el) {
    el.classList.add('open');
    el.querySelector('.phase-section-header').classList.add('open');
    el.querySelector('.phase-section-body').style.display = 'block';
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function attachEvents() {
  // Keyboard: close modal with Escape
  document.onkeydown = (e) => { if (e.key === 'Escape') { document.getElementById('modal-overlay').classList.remove('open'); } };
}

// ─────────────────────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────────────────────

// Check if any timer was already running when page was closed
function resumeTimer() {
  for (const [id, ss] of Object.entries(STATE.steps)) {
    if (ss.startedAt && !ss.completed) {
      startLiveTimer(id);
      break;
    }
  }
}

loadState();
render();
resumeTimer();
</script>
</body>
</html>
